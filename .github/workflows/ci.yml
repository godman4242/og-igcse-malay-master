# CI gate — mirrors the local pre-commit gate (build → unit → lint) and adds
# the Playwright e2e that the scheduled cloud routines CANNOT run (their
# network allowlist blocks the Playwright browser download — verified
# 2026-06-10, see docs/overnight/2026-06-10-08-report.md). Every push to main
# (human, builder routine, or merged overnight/* branch) gets the full check;
# a red run emails Kheshav, which doubles as the routines' failure alarm.
#
# Deployment is handled by Vercel's native Git integration (auto-deploys on
# push to `main`) — CI never deploys.

name: CI

on:
  push:
    branches: [main, 'overnight/**']
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Build · Unit · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
      - run: npm run lint

  e2e:
    # Serial on purpose: this suite is known to flake under parallel load
    # (first-run-tour) — serial is the source of truth.
    name: Playwright e2e (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # GitHub's shared runners are much slower than the dev machine: first CI
      # run failed a click at the strict 30s timeout on a spec that passes
      # locally (2026-06-10). CI absorbs runner variance with retries + a
      # doubled timeout; local runs stay strict so real slowness regressions
      # still surface there.
      - run: npm run test:e2e -- --workers=1 --retries=2 --timeout=60000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
